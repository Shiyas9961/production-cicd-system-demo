name: Multi Runner K3s Deployment

on:
  push:
    paths:
      - '07-multi-runner-deployment/**'
      - '.github/workflows/multi-runner-deployment.yml'
    branches:
      - main
      - develop

  workflow_dispatch:
    
permissions:
  contents: read

env:
  APP_DIRECTORY: 07-multi-runner-deployment
  IMAGE_NAME: flask-k3s-multi-runner-app
  K8S_NAMESPACE: devops-demo
  DEPLOYMENT_NAME: flask-app
  CONTAINER_NAME: flask-container
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

jobs:
  # -------------------------------------------------------
  # Job 1: SonarQube scan on the self-hosted runner
  # -------------------------------------------------------
  sonarqube-scan:
    name: SonarQube Security Check
    runs-on: self-hosted

    defaults:
      run:
        working-directory: ${{ env.APP_DIRECTORY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Sonar Connection
        run: |
          curl --fail --show-error \
            "${{ vars.SONAR_HOST_URL }}/api/system/status"

      - name: Clear SonarQube cache
        run: |
          rm -rf "$HOME/.sonar/cache"

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: ${{ env.APP_DIRECTORY }}
          args:
            -Dsonar.qualitygate.wait=true

  # -------------------------------------------------------
  # Job 2: Build and push image using GitHub-hosted runner
  # -------------------------------------------------------
  docker-build-push:
    name: Build and Push Docker image
    runs-on: ubuntu-latest
    needs: sonarqube-scan

    defaults:
      run:
        working-directory: ${{ env.APP_DIRECTORY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Hub Username
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ]; then
            echo "ERROR: DOCKERHUB_USERNAME repository variable is empty."
            exit 1
          fi

          echo "Docker Hub username: ${DOCKERHUB_USERNAME}"

      - name: Login To Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
            docker login \
            -u "${{ vars.DOCKERHUB_USERNAME }}" \
            --password-stdin

      - name: Build Docker Image
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"

          docker build \
            -t "${{ vars.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:latest" \
            -t "${{ vars.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${IMAGE_TAG}" \
            .

      - name: Push Docker Images
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"

          docker push \
            "${{ vars.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:latest"

          docker push \
            "${{ vars.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Set Deployment Image
        id: image-info
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          FULL_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${IMAGE_TAG}"

          echo "image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Published image: ${FULL_IMAGE}"

  # -------------------------------------------------------
  # Job 3: Deploy the Docker Hub image to K3s
  # -------------------------------------------------------
  deploy-k3s:
    name: Deploy To K3s
    runs-on: self-hosted
    needs: docker-build-push

    defaults:
      run:
        working-directory: ${{ env.APP_DIRECTORY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check K3s Cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Create Kubernetes Namespace
        run: |
          kubectl apply \
            -f k8s/namespace.yml

      - name: Apply Kubernetes Resources
        run: |
          kubectl apply \
            -f k8s/deployment.yml

          kubectl apply \
            -f k8s/service.yml

      - name: Update Deployment Image
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          DEPLOY_IMAGE="docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}"

          echo "Deploying image: ${DEPLOY_IMAGE}"

          if [ -z "${DOCKERHUB_USERNAME}" ]; then
            echo "ERROR: DOCKERHUB_USERNAME is empty."
            exit 1
          fi

          kubectl set image \
            deployment/${DEPLOYMENT_NAME} \
            ${CONTAINER_NAME}="${DEPLOY_IMAGE}" \
            -n "${K8S_NAMESPACE}"

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/${DEPLOYMENT_NAME} \
            -n "${K8S_NAMESPACE}" \
            --timeout=180s

      - name: Show Deployments
        run: |
          kubectl get deployments \
            -n "${K8S_NAMESPACE}" \
            -o wide

      - name: Show Pods
        run: |
          kubectl get pods \
            -n "${K8S_NAMESPACE}" \
            -o wide

      - name: Show Services
        run: |
          kubectl get svc \
            -n "${K8S_NAMESPACE}"

      - name: Health Check
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent --show-error \
              http://localhost:30080; then
              echo
              echo "Application health check passed."
              exit 0
            fi

            echo "Application is not ready. Attempt ${attempt}/10"
            sleep 5
          done

          echo "Application health check failed."

          kubectl get pods -n "${K8S_NAMESPACE}"
          kubectl describe deployment "${DEPLOYMENT_NAME}" \
            -n "${K8S_NAMESPACE}"

          kubectl logs \
            deployment/${DEPLOYMENT_NAME} \
            -n "${K8S_NAMESPACE}" \
            --tail=100 || true

          exit 1


