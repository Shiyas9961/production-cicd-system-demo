name: Multi Runner K3s Deployment

on:
  push:
    paths:
      - '07-multi-runner-deployment/**'
      - '.github/workflows/multi-runner-deployment.yml'
    branches:
      - main
      - develop

  workflow_dispatch:
    
permissions:
  contents: read

env:
  APP_DIRECTORY: 07-multi-runner-deployment
  IMAGE_NAME: flask-k3s-multi-runner-app
  K8S_NAMESPACE: devops-demo
  DEPLOYMENT_NAME: flask-app
  CONTAINER_NAME: flask-app

jobs:
  # -------------------------------------------------------
  # Job 1: SonarQube scan on the self-hosted runner
  # -------------------------------------------------------
  sonarqube-scan:
    name: SonarQube Security Check
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Sonar Connection
        run: |
          curl --fail --show-error \
            "${{ vars.SONAR_HOST_URL }}/api/system/status"

      - name: Clear SonarQube cache
        run: |
          rm -rf "$HOME/.sonar/cache"

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: ${{ env.APP_DIRECTORY }}
          args:
            -Dsonar.qualitygate.wait=true

  # -------------------------------------------------------
  # Job 2: Build and push image using GitHub-hosted runner
  # -------------------------------------------------------
  docker-build-push:
    name: Build and Push Docker image
    runs-on: ubuntu-latest
    needs: sonarqube-scan

    outputs:
      image: ${{ steps.image-info.outputs.image }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login To Docker Hub
      run: |
        echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
          docker login \
          -u "${{ secrets.DOCKERHUB_USERNAME }}" \
          --password-stdin

    - name: Build Docker Image
      working-directory: ${{ env.APP_DIRECTORY }}
      run: |
        IMAGE_TAG="${GITHUB_SHA::12}"

        docker build \
          -t "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:latest" \
          -t "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${IMAGE_TAG}" \
          .

    - name: Push Docker Images
      run: |
        IMAGE_TAG="${GITHUB_SHA::12}"

        docker push \
          "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:latest"

        docker push \
          "${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${IMAGE_TAG}"

    - name: Set Deployment Image
      id: image-info
      run: |
        IMAGE_TAG="${GITHUB_SHA::12}"
        FULL_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}:${IMAGE_TAG}"

        echo "image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
        echo "Published image: ${FULL_IMAGE}"


