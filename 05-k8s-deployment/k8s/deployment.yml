apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: devops-demo

spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app

  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-container
          image: flask-k8s-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
